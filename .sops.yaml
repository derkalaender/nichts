# I use age keys directly instead of converting SSH keys to age.
# This is simpler as I don't have to create SSH keys stored on the machine (I store them in the sops secrets file instead which would be a chicken-egg problem).

# Hosts and users have their own keys and own secrets file for better separation and a bit of RBAC.
# Secret files live next to the entity that owns them: nix/hosts/<host>/secrets and
# nix/users/<user>/secrets. Only secrets that belong to no entity live in nix/secrets.

### Key Location ###
# The keys are stored in ~/.config/sops/age/keys.txt
# That is, for each user it's in their home directory and for each host it's in /root.
# TODO: use impermanence and store the user & host keys under /persist

### Usage: User ###

# Create the key with:
# mkdir -p ~/.config/sops/age
# nix shell nixpkgs#age -c age-keygen -o ~/.config/sops/age/keys.txt

# Display the public key with:
# nix shell nixpkgs#age -c age-keygen -y ~/.config/sops/age/keys.txt

# Edit secrets with:
# nix shell nixpkgs#sops -c sops nix/users/something/secrets/user_something.yaml

# Rekey after editing recipients in .sops.yaml with:
# nix shell nixpkgs#sops -c sops updatekeys nix/users/something/secrets/user_something.yaml

### Usage: Host ###

# Create the key with:
# sudo sh -c "mkdir -p ~/.config/sops/age"
# nix shell nixpkgs#age -c sudo sh -c "age-keygen -o ~/.config/sops/age/keys.txt"

# Display the public key with:
# nix shell nixpkgs#age -c sudo sh -c "age-keygen -y ~/.config/sops/age/keys.txt"

# Edit secrets with:
# nix shell nixpkgs#sops -c sudo sops nix/hosts/something/secrets/host_something.yaml

# Rekey after editing recipients in .sops.yaml with:
# nix shell nixpkgs#sops -c sudo sops updatekeys nix/hosts/something/secrets/host_something.yaml

keys:
  - &bitwarden age1grp897uk453xrpmq6ed8qcqjwgjwm0s4usptwkkxa7ujy60cpawstq6tu5
  - &user_marvin_shika age1w4y2nmjdr00vz4hsa23edfa7mj7gzrk2lwvk7ysqwxv4zk6p83dqyeepmn
  - &user_marvin_itachi age1gadtzqahmsgvh0ugx00lrs7ug5dqrjs4ltqhpcngxxa0lv8xe5ushmxrzr
  - &host_shika age14vqkmwzdpz62ly9kpv0rezdq488f638avawfkmg36plhjskmwa5qdt35y6
  - &host_itachi age18d6mqxn5jf7ukuxm5ly933jpcntql9xw4ndrp75mpznm9j0nd34quf86fq
  - &host_kawauso age18veqr2x9td0yqkelue352x8ltrtpqmf7cq5ps2uqsp4hfgxc29wqdjep6s
creation_rules:
  - path_regex: nix/users/marvin/secrets/user_marvin.yaml
    key_groups:
      - age:
          - *bitwarden
          - *user_marvin_shika
          - *user_marvin_itachi
  - path_regex: nix/hosts/shika/secrets/user_passwords.yaml
    key_groups:
      - age:
          - *bitwarden
          - *host_shika
          - *user_marvin_shika
          - *user_marvin_itachi
  - path_regex: nix/secrets/host_itachi.yaml
    key_groups:
      - age:
          - *bitwarden
          - *host_itachi
          - *user_marvin_shika
          - *user_marvin_itachi
  - path_regex: nix/hosts/kawauso/secrets/host_kawauso.yaml
    key_groups:
      - age:
          - *bitwarden
          - *host_kawauso
          - *user_marvin_shika
          - *user_marvin_itachi
  - path_regex: nix/secrets/secureboot/*
    key_groups:
      - age:
          - *bitwarden
          - *host_shika
          - *user_marvin_shika
          - *user_marvin_itachi
  - path_regex: nix/users/marvin/secrets/atuin.yaml
    key_groups:
      - age:
          - *bitwarden
          - *user_marvin_shika
          - *user_marvin_itachi
  - path_regex: nix/hosts/shika/secrets/backup.yaml
    key_groups:
      - age:
          - *bitwarden
          - *host_shika
          - *user_marvin_shika
  - path_regex: nix/users/dot/secrets/deerlab.yaml
    key_groups:
      - age:
          - *bitwarden
          - *user_marvin_shika
          - *user_marvin_itachi
          - *host_kawauso
